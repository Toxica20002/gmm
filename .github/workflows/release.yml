name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create GitHub Release
  id-token: write   # needed for PyPI OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOML_VERSION=$(grep -A50 '^\[project\]' pyproject.toml | grep '^version' | head -1 | sed "s/version *= *['\"]//;s/['\"].*//")
          echo "Tag version:   $TAG"
          echo "TOML version:  $TOML_VERSION"
          if [ "$TAG" != "$TOML_VERSION" ]; then
            echo "ERROR: Tag v$TAG does not match pyproject.toml version $TOML_VERSION"
            echo "Bump version in pyproject.toml before tagging."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
