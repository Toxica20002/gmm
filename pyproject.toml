[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-monitor-mirror"
version = "0.1.0"
description = "A CLI tool to mirror or unmirror displays in GNOME Wayland/X11 sessions."
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    {name = "Toxica20002", email = "dinhquoclam02@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
dependencies = [
    "dbus-python>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Toxica20002/gmm"

[project.scripts]
gmm = "gmm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
